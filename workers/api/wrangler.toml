# PolishUp API Worker: accounts, sync, billing (plans/phase-4.md).
# Deploy steps live in README.md. Nothing here is secret: set the secrets with
# `wrangler secret put` (STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET,
# RESEND_API_KEY, CODE_PEPPER, UNSUB_SECRET).
name = "polishup-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
# Origins allowed to call the API: comma-separated, exact match, no trailing slash.
ALLOWED_ORIGINS = "https://polishup.app,http://localhost:3000"
# Any https origin whose host ends with this (Cloudflare Pages previews).
ALLOWED_ORIGIN_SUFFIX = ".polish-exercises.pages.dev"
APP_URL = "https://polishup.app"
API_URL = "https://api.polishup.app"
EMAIL_FROM = "PolishUp <hello@mail.polishup.app>"
# "true": every new account gets the free `beta` entitlement (§8). Set "false"
# and deploy to close the beta; existing beta accounts keep it.
BETA_OPEN = "true"
# ISO date (e.g. "2026-12-31"); empty = no Lifetime offer.
LIFETIME_OFFER_UNTIL = ""
# Stripe Price ids (§9.2).
PRICE_MONTHLY = ""
PRICE_ANNUAL = ""
PRICE_LIFETIME = ""
# JSON: list name → Resend segment id (§10.1).
RESEND_SEGMENTS = "{}"

[[d1_databases]]
binding = "DB"
database_name = "polishup-api"
# `wrangler d1 create polishup-api`, then paste its id here.
database_id = "5672425c-0cdd-448c-bc4f-5ab0b0fe283a"
migrations_dir = "migrations"

# Per-IP limits (§4.6). namespace_id is any positive integer unique within the
# Cloudflare account. period must be 10 or 60 seconds.
[[ratelimits]]
name = "AUTH_IP_LIMITER"
namespace_id = "1601"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "VERIFY_IP_LIMITER"
namespace_id = "1602"
simple = { limit = 10, period = 60 }

# Hourly: trial reminders and list retries; daily at 03:30 UTC: clean-up (§11).
# Separate runs keep each inside the 50-subrequest budget. src/cron.ts
# dispatches on these exact strings (HOURLY_CRON, CLEANUP_CRON).
[triggers]
crons = ["0 * * * *", "30 3 * * *"]
